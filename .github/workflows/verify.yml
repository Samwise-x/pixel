name: Verify Pixel engineering gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository configuration
        run: |
          python3 -m json.tool opencode.json >/dev/null
          python3 -m json.tool .opencode/package.json >/dev/null
          git diff --check
          test -f AGENTS.md
          test -f CONTEXT.md
          test -f docs/agents/issue-tracker.md
      - name: Install v2 plugin SDK
        run: npm install --prefix .opencode --no-audit --no-fund
      - name: Run deterministic policy tests
        run: node --experimental-strip-types --test .opencode/tests/*.test.mjs
